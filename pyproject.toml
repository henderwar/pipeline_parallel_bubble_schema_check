[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "henderwar-pipeline_parallel_bubble_schema_check"
version = "0.1.0"
description = "从样本里推断推理成本优化顾问·流水线并行气泡比例应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "henderwar" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://henderwar.github.io"
Repository = "https://github.com/henderwar/pipeline_parallel_bubble_schema_check"
Issues = "https://github.com/henderwar/pipeline_parallel_bubble_schema_check/issues"

[project.scripts]
pipeline_parallel_bubble_schema_check = "pipeline_parallel_bubble_schema_check:main"

[tool.setuptools]
py-modules = ["pipeline_parallel_bubble_schema_check"]
